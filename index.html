</style><style id="paperStyle"></style></head><body><div id="topbar"><button id="menuToggle" onclick="toggleMenu()" aria-label="Abrir menú" aria-expanded="false">☰</button><strong>Moda POS</strong><span class="mobile-label">PUNTO DE VENTA</span></div><div id="shade" onclick="closeMenu()"></div><aside><button id="closeNav" onclick="closeMenu()" aria-label="Cerrar menú">×</button><h2><span class="brandmark">M</span> Moda POS <br><small style="font-size:12px">GESTIÓN DE TIENDA</small></h2><nav id="nav"></nav><div class="bottom">Prototipo comercial · v6.0<br>Datos de demostración</div></aside><main><header><div><h1 id="heading"></h1><p id="sub"></p></div><div><span class="tag">Demo comercial</span> <button class="primary" onclick="go('Ventas')">+ Nueva venta</button></div></header><div id="view"></div><button id="mobileCart" onclick="reviewOrder()" hidden></button></main><div id="bottomnav" aria-label="Accesos rápidos"></div><dialog id="modal"></dialog><script>
const money=n=>'S/ '+Number(n).toFixed(2);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const seed=[['Polo oversize','Polos','👕',45,22,'Negro','M',8],['Polo oversize','Polos','👕',45,22,'Blanco','L',5],['Jean clásico','Pantalones','👖',89,48,'Azul','32',6],['Vestido casual','Vestidos','👗',79,38,'Beige','S',3],['Casaca urbana','Casacas','🧥',119,65,'Negro','L',4],['Blusa básica','Blusas','👚',49,24,'Rosado','M',2]];let db;try{db=JSON.parse(localStorage.getItem('moda-demo-v2'))}catch{};db=db||{items:seed.map((x,i)=>({id:i+1,name:x[0],cat:x[1],icon:x[2],price:x[3],cost:x[4],color:x[5],size:x[6],stock:x[7]})),sales:[],clients:[],cash:null,expenses:[],closures:[]};let cart={},page='Inicio',query='',category='Todas';const save=()=>localStorage.setItem('moda-demo-v2',JSON.stringify(db));const pages=['Inicio','Ventas','Productos','Inventario','Caja','Clientes','Reportes','Registro de ventas'];const paths=['<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>','<path d="M2 3h3l3 12h11l3-9H6"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/>','<path d="M8 3 3 6l-1 5 5 2v8h10v-8l5-2-1-5-5-3c-1 4-7 4-8 0z"/>','<path d="m3 7 9-4 9 4v13H3zM3 7l9 4 9-4M12 11v9"/>','<rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 10h18M14 15h4"/>','<circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>','<path d="M3 3v18h18M7 16v-5m5 5V6m5 10V9"/>'];paths.push('<path d="M5 3h14v18l-3-2-4 2-4-2-3 2zM8 8h8M8 12h8M8 16h5"/>');const icons=paths.map(p=>`<svg class="navicon" viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`);const descriptions=['Resumen de tu negocio','Registra una venta en pocos pasos','Catálogo, tallas y colores','Control de existencias por variante','Apertura, movimientos y cierre','Directorio de compradores','Analiza el rendimiento de tu tienda','Consulta operaciones y reimprime notas de venta'];const V=document.getElementById('view'),M=document.getElementById('modal');const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const daily=()=>db.sales.filter(s=>s.day===today());const sum=(a,f)=>a.reduce((n,x)=>n+f(x),0);const total=()=>sum(Object.entries(cart),([id,q])=>db.items.find(p=>p.id==id).price*q);function go(p){page=p;document.body.classList.remove('has-cart');query='';category='Todas';closeMenu();window.scrollTo(0,0);document.getElementById("mobileCart").hidden=true;render()}function render(){document.getElementById('nav').innerHTML='<div class="sectionlabel">OPERACIONES</div>'+pages.map((p,i)=>`<button class="${p===page?'active':''}" onclick="go('${p}')">${icons[i]}${p}</button>`).join('');document.getElementById('bottomnav').innerHTML=['Inicio','Ventas','Registro de ventas','Más'].map((n,i)=>`<button class="${page===n?'active':''}" onclick="${i===3?'toggleMenu()':`go('${n}')`}">${i===3?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>':icons[pages.indexOf(n)]}<span>${['Inicio','Vender','Historial','Más'][i]}</span></button>`).join('');document.getElementById('heading').textContent=page==='Inicio'?'Mi tienda':page==='Ventas'?'Nueva venta':page;document.getElementById('sub').textContent=descriptions[pages.indexOf(page)];({Inicio:home,Ventas:pos,Productos:()=>inventory(false),Inventario:()=>inventory(true),Caja:cash,Clientes:clients,Reportes:reports,'Registro de ventas':historySales}[page])()}
function stats(){return `<div class="cards">${[['Ventas de hoy',money(sum(daily(),s=>s.total)),'Ingresos registrados'],['Ventas realizadas',daily().length,'Operaciones de hoy'],['Unidades en stock',sum(db.items,p=>p.stock),'Todas las variantes'],['Utilidad bruta',money(sum(daily(),s=>s.profit)),'Antes de gastos']].map(x=>`<div class="stat"><span class="muted">${x[0]}</span><b>${x[1]}</b><small>${x[2]}</small></div>`).join('')}</div>`}function salesTable(sales){return `<div class="scroll"><table><tr><th>Nota de venta</th><th>Cliente</th><th>Pago</th><th>Total</th></tr>${sales.slice().reverse().map(s=>`<tr><td><button onclick="receipt(${s.id})">${saleCode(s.id)}</button></td><td>${esc(s.client)}</td><td>${esc(s.pay)}</td><td>${money(s.total)}</td></tr>`).join('')||'<tr><td colspan="4">Todavía no hay ventas registradas.</td></tr>'}</table></div>`}function home(){V.innerHTML=`<div class="quickstart"><div><h2>Registra una venta</h2><p>Elige las prendas, cobra y entrega el ticket.</p></div><button onclick="go('Ventas')">+ Nueva venta →</button></div><div class="quicklinks">${['Registro de ventas','Productos','Inventario','Caja'].map((n,i)=>`<button onclick="go('${n}')">${icons[pages.indexOf(n)]}${['Historial','Mis prendas','Inventario','Mi caja'][i]}</button>`).join('')}</div>`+stats()+`<div class="split"><section class="panel"><h3>Últimas ventas</h3>${salesTable(db.sales.slice(-5))}</section><section class="panel"><h3>Stock por categoría</h3>${[...new Set(db.items.map(p=>p.cat))].map(c=>{let n=sum(db.items.filter(p=>p.cat===c),p=>p.stock);return `<div class="line"><span>${esc(c)}</span><b>${n}</b></div><div class="bar"><span style="width:${n/Math.max(1,sum(db.items,p=>p.stock))*100}%"></span></div>`}).join('')}<div class="notice">${db.items.filter(p=>p.stock<=3).length} variantes con stock bajo.</div></section></div>`}let reviewing=false;function reviewOrder(){if(!Object.keys(cart).length)return;reviewing=true;document.querySelector('.pos-layout').classList.add('review');document.getElementById('step1').classList.remove('current');document.getElementById('step2').classList.add('current');drawCart();window.scrollTo(0,0)}function backToProducts(){reviewing=false;document.querySelector('.pos-layout').classList.remove('review');document.getElementById('step1').classList.add('current');document.getElementById('step2').classList.remove('current');drawCart();window.scrollTo(0,0)}function pos(){reviewing=false;V.innerHTML=`<div class="stepper"><span id="step1" class="current">1. Prendas</span><span id="step2">2. Cobrar</span><span>3. Ticket</span></div><div class="split pos-layout"><section class="panel" id="catalog"><div class="catalog-head"><h3>Selecciona las prendas</h3><span>${db.items.length} variantes</span></div><input class="search" placeholder="Buscar prenda, talla o color..." id="search" value="${esc(query)}" oninput="query=this.value;drawProducts()"><div class="category-strip" id="categories"></div><div class="products" id="products"></div></section><section class="panel" id="checkout"><button class="backstep" onclick="backToProducts()">← Seguir agregando prendas</button><h3>Confirmar pedido</h3><div class="cashstate"><span>${db.cash?'Caja abierta':'Caja cerrada'}</span>${db.cash?'':'<button onclick="openCashForSale()">Abrir caja</button>'}</div><div id="cart"></div><div class="line"><label for="buyer">Cliente (opcional)</label><button onclick="newClient(true)">+ Registrar cliente</button></div><select id="buyer" class="full" onchange="buyerChanged()"><option value="">Público general</option>${db.clients.map((c,i)=>`<option value="${i}">${esc(c.name)}${c.phone?' · '+esc(c.phone):''}</option>`).join('')}</select><small id="buyerInfo" class="muted"></small><p style="margin:15px 0 5px">Método de pago</p><div class="paychoices">${['Efectivo','Yape','Plin','Tarjeta','Transferencia'].map((p,i)=>`<label><input type="radio" name="payment" value="${p}" ${i===0?'checked':''}>${p}</label>`).join('')}</div><p style="margin:15px 0 5px">Documento</p><select class="full"><option>Nota de venta interna</option></select><button class="primary full" onclick="sell()">Confirmar venta y generar ticket</button><p style="font-size:12px;margin-top:12px">Boleta y factura electrónica: integración futura.</p></section></div>`;drawProducts();drawCart()}function garment(p){let color=({Negro:'#30353a',Blanco:'#fdfdfb',Azul:'#496b8b',Beige:'#c7b39a',Rosado:'#d2a0a8'})[p.color]||'#8799a8';let path=p.cat==='Pantalones'?'M54 15H106L112 111H85L80 57L75 111H48Z':p.cat==='Vestidos'?'M65 12H95L105 45L96 55L121 111H39L64 55L55 45Z':p.cat==='Casacas'?'M58 15L35 24L19 79L41 85L51 49V112H109V49L119 85L141 79L125 24L102 15Z':'M60 16L39 22L18 44L39 63L51 50V108H109V50L121 63L142 44L121 22L100 16Q80 35 60 16Z';return `<svg viewBox="0 0 160 126" role="img" aria-label="Ilustración de prenda"><path d="${path}" fill="${color}" stroke="#65707a" stroke-width="1.2"/>${p.cat==='Pantalones'?'<path d="M55 28h50M80 16v41M57 32l15 10m31-10-15 10" stroke="#263c50" opacity=".6" fill="none"/>':p.cat==='Casacas'?'<path d="M80 16v96M58 15l22 23 22-23M58 76h13m18 0h13" stroke="#c9cdd0" fill="none"/>':''}</svg>`}function setCategory(i){category=['Todas',...new Set(db.items.map(p=>p.cat))][i];drawProducts()}function drawProducts(){document.getElementById('categories').innerHTML=['Todas',...new Set(db.items.map(p=>p.cat))].map((c,i)=>`<button class="${c===category?'chosen':''}" onclick="setCategory(${i})">${esc(c)}</button>`).join('');document.getElementById('products').innerHTML=db.items.filter(p=>(category==='Todas'||p.cat===category)&&`${p.name} ${p.color} ${p.size} ${p.cat}`.toLowerCase().includes(query.toLowerCase())).map(p=>`<div class="product"><div class="pic">${garment(p)}</div><div class="product-info"><b>${esc(p.name)}</b><small class="muted">${esc(p.color)} · Talla ${esc(p.size)} · Stock ${p.stock}</small><div class="addline"><strong class="price">${money(p.price)}</strong><button onclick="add(${p.id},1)" ${p.stock<1?'disabled':''}>+ Agregar</button></div><small class="selected" id="selected-${p.id}">${cart[p.id]?cart[p.id]+' en pedido':''}</small></div></div>`).join('')||'Sin resultados'}function add(id,n){let p=db.items.find(x=>x.id===id),q=(cart[id]||0)+n;if(q>p.stock)return alert('Stock insuficiente');if(q<=0)delete cart[id];else cart[id]=q;drawCart()}function drawCart(){let mc=document.getElementById("mobileCart");let count=sum(Object.values(cart),q=>q);mc.hidden=!count||reviewing;document.body.classList.toggle('has-cart',!mc.hidden);mc.textContent=`Ver pedido (${count}) · ${money(total())} →`;db.items.forEach(p=>{let el=document.getElementById('selected-'+p.id);if(el)el.textContent=cart[p.id]?cart[p.id]+' en pedido':''});document.getElementById('cart').innerHTML=(Object.keys(cart).length?'':'<div class="emptycart">Selecciona una prenda para iniciar la venta.</div>')+Object.entries(cart).map(([id,q])=>{let p=db.items.find(x=>x.id==id);return `<div class="cartline"><div><b>${esc(p.name)}</b><br><small>${esc(p.color)} / ${esc(p.size)}</small></div><div><button onclick="add(${id},-1)">−</button> ${q} <button onclick="add(${id},1)">+</button></div><b>${money(q*p.price)}</b></div>`}).join('')+`<div class="line total"><span>Total</span><span>${money(total())}</span></div>`}function sell(){if(!Object.keys(cart).length)return alert('Agrega productos');if(!db.cash)return alert('Abre la caja primero desde el módulo Caja.');let lines=Object.entries(cart).map(([id,q])=>{let p=db.items.find(x=>x.id==id);return {...p,q}});if(lines.some(p=>p.q>p.stock))return alert('Stock insuficiente');let s={id:db.sales.length+1,day:today(),timestamp:new Date().toISOString(),client:selectedBuyer()?.name||'Público general',phone:selectedBuyer()?.phone||'',document:selectedBuyer()?.document||'',pay:document.querySelector('input[name=payment]:checked').value,total:total(),profit:sum(lines,p=>(p.price-p.cost)*p.q),lines,cashId:db.cash.id};lines.forEach(l=>db.items.find(p=>p.id===l.id).stock-=l.q);db.sales.push(s);cart={};save();pos( function saleTime(s){return s.timestamp?new Date(s.timestamp).toLocaleString('es-PE',{dateStyle:'short',timeStyle:'short'}):s.day}
function historySales(){V.innerHTML=`<div class="cards"><div class="stat">Operaciones<b>${db.sales.length}</b></div><div class="stat">Total vendido<b>${money(sum(db.sales,s=>s.total))}</b></div><div class="stat">Unidades vendidas<b>${sum(db.sales,s=>sum(s.lines,p=>p.q))}</b></div><div class="stat">Utilidad bruta<b>${money(sum(db.sales,s=>s.profit))}</b></div></div><section class="panel"><div class="line"><h3>Registro de ventas realizadas</h3><button class="primary" onclick="go('Ventas')">+ Nueva venta</button></div><div class="filters"><input id="saleSearch" placeholder="Buscar número o cliente" oninput="drawHistory()"><input id="saleDate" type="date" onchange="drawHistory()"><select id="salePay" onchange="drawHistory()"><option value="">Todos los medios de pago</option>${['Efectivo','Yape','Plin','Tarjeta','Transferencia'].map(p=>`<option>${p}</option>`).join('')}</select><button onclick="document.getElementById('saleSearch').value='';document.getElementById('saleDate').value='';document.getElementById('salePay').value='';drawHistory()">Limpiar</button></div><div id="historyRows"></div></section>`;drawHistory()}
function drawHistory(){let q=document.getElementById('saleSearch').value.toLowerCase(),d=document.getElementById('saleDate').value,p=document.getElementById('salePay').value;let rows=db.sales.filter(s=>(saleCode(s.id)+' '+s.client).toLowerCase().includes(q)&&(!d||s.day===d)&&(!p||s.pay===p)).slice().reverse();document.getElementById('historyRows').innerHTML=`<div class="scroll"><table><tr><th>Documento</th><th>Fecha y hora</th><th>Cliente</th><th>Unid.</th><th>Pago</th><th>Total</th><th>Estado</th><th>Acción</th></tr>${rows.map(s=>`<tr><td><b>${saleCode(s.id)}</b></td><td>${esc(saleTime(s))}</td><td>${esc(s.client)}</td><td>${sum(s.lines,p=>p.q)}</td><td>${esc(s.pay)}</td><td><b>${money(s.total)}</b></td><td><span class="completed">Realizada</span></td><td><button onclick="receipt(${s.id})">Ver ticket / Imprimir</button></td></tr>`).join('')||'<tr><td colspan="8">No hay ventas que coincidan. Registra una operación en Ventas.</td></tr>'}</table></div><p style="margin:15px 0 0">${rows.length} operaciones · Total filtrado: <b>${money(sum(rows,s=>s.total))}</b></p>`}
function ticketLogo(){return db.ticketLogo?`<img src="${esc(db.ticketLogo)}" alt="Logo del negocio">`:`<svg viewBox="0 0 100 58" width="90" height="52" aria-label="Logo provisional"><path d="M50 5a7 7 0 0 1 5 12l-5 4v4L12 46q-5 5 3 5h70q8 0 3-5L50 25" stroke="black" stroke-width="3" fill="none" stroke-linejoin="round"/><text x="50" y="44" text-anchor="middle" font-size="15" font-family="Arial" font-weight="bold">M</text></svg>`}
function uploadLogo(input,id){let f=input.files[0];if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>1000000)return alert('Selecciona PNG, JPG o WebP de hasta 1 MB.');let r=new FileReader();r.onload=()=>{db.ticketLogo=r.result;try{save()}catch(e){delete db.ticketLogo;return alert('No hay espacio para guardar el logo.')}receipt(id)};r.readAsDataURL(f)}

ixed(2)}</b></div><hr><div class="ticket-center">¡Gracias por su compra!<br><small>Documento interno sin valor tributario</small></div></article></div><div class="ticket-controls print-hint">Seleccione el mismo ancho de papel en el controlador de la impresora y desactive encabezados y pies del navegador.</div>`;ticketWidth(db.ticketWidth||'80');if(!M.open)M.showModal()}
M.addEventListener('close',()=>M.classList.remove('ticket-modal'));
function inventory(stock){V.innerHTML=`<section class="panel"><div class="line"><h3>${stock?'Existencias':'Catálogo de productos'}</h3><button class="primary" onclick="newProduct()">+ Nueva variante</button></div><div class="scroll"><table><tr><th>Producto</th><th>Categoría</th><th>Color</th><th>Talla</th><th>Costo</th><th>Precio</th><th>Stock</th><th>Acción</th></tr>${db.items.map(p=>`<tr><td>${esc(p.name)}<span class="sku">SKU-${String(p.id).slice(-5).padStart(4,'0')}</span></td><td>${esc(p.cat)}</td><td>${esc(p.color)}</td><td>${esc(p.size)}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td style="color:${p.stock<=3?'#b66b16':'inherit'}">${p.stock}</td><td><button onclick="adjust(${p.id})">Ajustar stock</button></td></tr>`).join('')}</table></div></section>`}function adjust(id){let p=db.items.find(x=>x.id===id);let n=prompt('Nuevo stock para '+p.name+' / '+p.color+' / '+p.size,p.stock);if(n===null)return;if(!/^\d+$/.test(n))return alert('Ingresa un entero no negativo');p.stock=Number(n);save();render()}function newProduct(){M.innerHTML=`<h3>Nueva variante</h3><form onsubmit="event.preventDefault();createProduct(this)">${[['name','Nombre de prenda','text'],['cat','Categoría','text'],['color','Color','text'],['size','Talla','text'],['cost','Costo','number'],['price','Precio','number'],['stock','Stock inicial','number']].map(([n,l,t])=>`<label>${l}<input class="full" name="${n}" type="${t}" ${t==='number'?'min="0" step="'+(n==='stock'?'1':'0.01')+'"':''} required></label>`).join('')}<button class="primary full">Guardar</button><button type="button" class="full" onclick="M.close()">Cancelar</button></form>`;M.showModal()}function createProduct(f){let d=Object.fromEntries(new FormData(f));db.items.push({...d,id:Date.now(),icon:'👕',price:+d.price,cost:+d.cost,stock:+d.stock});save();M.close();render()}
function cash(){let c=db.cash,s=c?db.sales.filter(s=>s.cashId===c.id):[],e=c?db.expenses.filter(e=>e.cashId===c.id):[],balance=c?c.initial+sum(s.filter(s=>s.pay==='Efectivo'),s=>s.total)-sum(e,e=>e.amount):0;V.innerHTML=`<div class="panel"><h3>Caja ${c?'abierta':'cerrada'}</h3>${c?`<div class="cards"><div class="stat">Fondo inicial<b>${money(c.initial)}</b></div><div class="stat">Ventas en efectivo<b>${money(sum(s.filter(s=>s.pay==='Efectivo'),s=>s.total))}</b></div><div class="stat">Otros pagos<b>${money(sum(s.filter(s=>s.pay!=='Efectivo'),s=>s.total))}</b></div><div class="stat">Efectivo esperado<b>${money(balance)}</b></div></div><button onclick="expense()">Registrar gasto en efectivo</button> <button class="primary" onclick="closeCash(${balance})">Cerrar caja</button>`:`<p>Inicia una jornada para registrar ventas.</p><button class="primary" onclick="openCash()">Abrir caja</button>`}<h3 style="margin-top:24px">Últimos cierres</h3>${db.closures.slice().reverse().map(c=>`<div class="line"><span>${esc(c.day)}</span><b>${money(c.balance)}</b></div>`).join('')||'<p>Sin cierres registrados.</p>'}</div>`}function amount(msg){let a=prompt(msg,'0');return a===null||a.trim()===''||!Number.isFinite(+a)||+a<0?null:+a}function openCashForSale(){let buyer=document.getElementById('buyer').value,pay=document.querySelector('input[name=payment]:checked').value,was=reviewing;openCash();if(db.cash){document.getElementById('buyer').value=buyer;buyerChanged();document.querySelectorAll('input[name=payment]').forEach(el=>el.checked=el.value===pay);if(was)reviewOrder()}}function openCash(){let a=amount('Fondo inicial en soles');if(a===null)return;db.cash={id:Date.now(),initial:a};save();render()}function expense(){let a=amount('Importe del gasto en efectivo');if(a===null)return;db.expenses.push({cashId:db.cash.id,amount:a});save();cash()}function closeCash(balance){if(!confirm('Cerrar caja con efectivo esperado '+money(balance)+'?'))return;db.closures.push({day:today(),balance});db.cash=null;save();cash()}
function clients(){V.innerHTML=`<section class="panel"><div class="line"><h3>Clientes registrados</h3><button class="primary" onclick="newClient()">+ Cliente</button></div><table><tr><th>Nombre</th><th>DNI / RUC</th><th>Celular</th></tr>${db.clients.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.document||"—")}</td><td>${esc(c.phone)}</td></tr>`).join('')||'<tr><td colspan="3">Sin clientes registrados.</td></tr>'}</table></section>`}function selectedBuyer(){let v=document.getElementById('buyer')?.value;return v===''||v==null?null:db.clients[Number(v)]}function buyerChanged(){let c=selectedBuyer();document.getElementById('buyerInfo').textContent=c?[c.document,c.phone].filter(Boolean).join(' · '):''}function newClient(fromSale=false){M.classList.remove('ticket-modal');M.innerHTML=`<h3>Registrar cliente</h3><form onsubmit="event.preventDefault();saveClient(this,${fromSale})"><label>Nombre y apellidos<input class="full" name="name" required maxlength="100" autocomplete="name"></label><label>DNI / RUC (opcional)<input class="full" name="document" inputmode="numeric" pattern="[0-9]{8}|[0-9]{11}"></label><label>Celular / WhatsApp (opcional)<input class="full" name="phone" type="tel" autocomplete="tel" placeholder="987 654 321"></label><button class="primary full">Guardar cliente</button><button type="button" class="full" onclick="M.close()">Cancelar</button></form>`;M.showModal()}function saveClient(f,fromSale){let c=Object.fromEntries(new FormData(f));c.name=c.name.trim();c.phone=c.phone.trim();if(!c.name)return alert('Ingrese el nombre');if(c.phone&&!normalizePhone(c.phone))return alert('Ingrese un celular peruano de 9 dígitos o número internacional con +');db.clients.push(c);save();M.close();if(fromSale){let buyer=document.getElementById('buyer');buyer.add(new Option(c.name+(c.phone?' · '+c.phone:''),db.clients.length-1));buyer.value=String(db.clients.length-1);buyerChanged()}else clients()}
function normalizePhone(v){let n=v.replace(/\D/g,'');if(n.length===9&&n.startsWith('9'))return '51'+n;if(n.startsWith('51')&&n.length===11)return n;if(v.trim().startsWith('+')&&n.length>=8&&n.length<=15)return n;return ''}function ticketText(s){return ['MODA POS','NOTA DE VENTA '+saleCode(s.id),saleTime(s),'Cliente: '+s.client,...s.lines.map(p=>`${p.q} x ${p.name} (${p.color} / ${p.size}) — ${money(p.q*p.price)}`),'TOTAL: '+money(s.total),'Pago: '+s.pay,'¡Gracias por su compra!','Documento interno sin valor tributario.'].join('\n')}function shareWhatsApp(id){let s=db.sales.find(x=>x.id===id);let phone=s.phone||db.clients.find(c=>c.name===s.client)?.phone||'';let v=prompt('Celular del destinatario (incluya +código de país si no es Perú). Deje vacío para elegir contacto en WhatsApp.',phone);if(v===null)return;let n=normalizePhone(v);if(v.trim()&&!n)return alert('Número inválido');window.open('https://wa.me/'+n+'?text='+encodeURIComponent(ticketText(s)),'_blank','noopener,noreferrer')}
async function shareTicketImage(id){let s=db.sales.find(x=>x.id===id);let canvas=document.createElement('canvas');canvas.width=576;let lines=ticketText(s).split('\n');let ctx=canvas.getContext('2d');ctx.font='22px monospace';let wrapped=[];for(let line of lines){let buf='';for(let word of line.split(' ')){if(ctx.measureText(buf+' '+word).width>520&&buf){wrapped.push(buf);buf=word}else buf+=(buf?' ':'')+word}wrapped.push(buf)}canvas.height=180+wrapped.length*32;ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='black';ctx.textAlign='center';ctx.font='bold 28px Arial';ctx.fillText('MODA POS',288,125);if(db.ticketLogo){try{let img=new Image();img.src=db.ticketLogo;await img.decode();let r=Math.min(180/img.width,75/img.height);ctx.drawImage(img,288-img.width*r/2,15,img.width*r,img.height*r)}catch{}}else{ctx.font='bold 54px Arial';ctx.fillText('M',288,75)}ctx.textAlign='left';ctx.font='22px monospace';wrapped.forEach((l,i)=>ctx.fillText(l,28,165+i*32,520));let blob=await new Promise(r=>canvas.toBlob(r,'image/png'));let file=new File([blob],saleCode(id)+'.png',{type:'image/png'});if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:'Nota de venta'});return}catch(e){if(e.name==='AbortError')return}}let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);alert('Ticket descargado. Adjúntalo en WhatsApp.')}
function closeMenu(){document.querySelector('aside').classList.remove('expanded');document.getElementById('shade').classList.remove('open');document.body.classList.remove('menu-open');document.getElementById('menuToggle').setAttribute('aria-expanded','false')}function toggleMenu(){let open=document.querySelector('aside').classList.toggle('expanded');document.getElementById('shade').classList.toggle('open',open);document.body.classList.toggle('menu-open',open);document.getElementById('menuToggle').setAttribute('aria-expanded',String(open))}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});window.matchMedia('(min-width:901px)').addEventListener('change',closeMenu);
function reports(){let counts={};db.sales.forEach(s=>s.lines.forEach(p=>counts[p.name]=(counts[p.name]||0)+p.q));V.innerHTML=stats()+`<div class="split"><section class="panel"><h3>Historial de ventas</h3>${salesTable(db.sales)}</section><section class="panel"><h3>Prendas más vendidas</h3>${Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([n,q])=>`<div class="line"><span>${esc(n)}</span><b>${q}</b></div><div class="bar"><span style="width:${q/Math.max(...Object.values(counts))*100}%"></span></div>`).join('')||'<p>Registra una venta para visualizar resultados.</p>'}<h3>Utilidad bruta acumulada</h3><b>${money(sum(db.sales,s=>s.profit))}</b></section></div>`}render();
</script></body></html>
